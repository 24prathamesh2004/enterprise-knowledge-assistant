<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enterprise Knowledge Assistant</title>
  <style>
    :root { --bg:#0f1117; --panel:#1a1d27; --border:#2a2e3a; --text:#e6e8ee;
            --muted:#9aa0ad; --accent:#6d8bff; --good:#3fbf7f; --warn:#e0a83e; --bad:#e0574e; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .wrap { max-width:820px; margin:0 auto; padding:32px 20px 64px; }
    h1 { font-size:22px; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
    .row { display:flex; gap:10px; }
    input { flex:1; padding:12px 14px; background:var(--panel); color:var(--text);
            border:1px solid var(--border); border-radius:10px; font-size:15px; }
    button { padding:12px 20px; background:var(--accent); color:#fff; border:0;
             border-radius:10px; font-size:15px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:12px;
            padding:18px 20px; margin-top:20px; }
    .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em;
               color:var(--muted); margin:0 0 10px; }
    .answer { white-space:pre-wrap; line-height:1.55; }
    .scores { display:flex; flex-wrap:wrap; gap:10px; }
    .score { flex:1; min-width:130px; background:var(--bg); border:1px solid var(--border);
             border-radius:10px; padding:10px 12px; }
    .score .name { font-size:12px; color:var(--muted); }
    .score .val { font-size:20px; font-weight:600; }
    .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
    .summary { color:var(--muted); font-size:14px; margin-top:12px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { font-size:12px; background:var(--bg); border:1px solid var(--border);
            border-radius:20px; padding:4px 12px; color:var(--muted); }
    .escalation { border-color:var(--warn); color:var(--warn); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Enterprise Knowledge Assistant</h1>
    <p class="sub">Ask about company policies. Answers are grounded in the knowledge base, scored with RAGAS, and audited via MCP.</p>

    <div class="row">
      <input id="q" placeholder="How many paid leave days do I get per year?" autofocus />
      <button id="go">Ask</button>
    </div>

    <div id="out" class="hidden">
      <div class="card"><h2>Answer</h2><div id="answer" class="answer"></div></div>
      <div class="card">
        <h2>RAGAS evaluation</h2>
        <div id="scores" class="scores"></div>
        <div id="summary" class="summary"></div>
      </div>
      <div id="escCard" class="card escalation hidden"><h2>Escalation</h2><div id="esc"></div></div>
      <div class="card"><h2>Execution trace</h2><div id="trace" class="chips"></div></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const cls = (v) => v == null ? "" : v >= 0.8 ? "good" : v >= 0.6 ? "warn" : "bad";
    const fmt = (v) => v == null ? "n/a" : v.toFixed(2);

    async function ask() {
      const question = $("q").value.trim();
      if (!question) return;
      $("go").disabled = true; $("go").textContent = "Thinking…";
      try {
        const res = await fetch("/ask", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        $("answer").textContent = data.answer || "(no answer)";
        $("scores").innerHTML = Object.entries(data.scores || {})
          .filter(([k]) => !k.startsWith("_"))
          .map(([k, v]) => `<div class="score"><div class="name">${k}</div>
            <div class="val ${cls(v)}">${fmt(v)}</div></div>`).join("");
        $("summary").textContent = data.evaluation_summary || "";
        if (data.escalated) {
          $("escCard").classList.remove("hidden");
          $("esc").textContent = `Low-confidence query escalated to a human — ticket ${data.ticket_id}.`;
        } else {
          $("escCard").classList.add("hidden");
        }
        $("trace").innerHTML = (data.trace || [])
          .map((n) => `<span class="chip">${n}</span>`).join("");
        $("out").classList.remove("hidden");
      } catch (e) {
        $("answer").textContent = "Request failed: " + e;
        $("out").classList.remove("hidden");
      } finally {
        $("go").disabled = false; $("go").textContent = "Ask";
      }
    }

    $("go").addEventListener("click", ask);
    $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
  </script>
</body>
</html>
